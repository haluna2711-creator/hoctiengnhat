<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C79D9D"/>
      <stop offset="100%" stop-color="#A6797A"/>
    </linearGradient>
  </defs>

  <!-- nền squircle — tông Rosy Brown, đủ đậm để nổi trên mọi tab trình duyệt -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill="url(#bg)"/>

  <!-- vòng triện mờ, gợi con dấu hanko dùng xuyên suốt theme -->
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="#FFF5EE" stroke-width="1.3" opacity="0.35"/>

  <!-- chữ 語 — cùng ký tự dùng ở logo header -->
  <text x="32.5" y="33.5" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Serif CJK JP', serif"
        font-weight="700" font-size="38"
        fill="#FFF5EE" letter-spacing="0">語</text>

  <!-- ô nhỏ dưới đáy, gợi ô vuông genkouyoushi (mô-típ giấy luyện chữ) -->
  <rect x="24" y="47.5" width="16" height="9" rx="1.5" fill="none" stroke="#FFF5EE" stroke-width="1.3" opacity="0.55"/>
</svg>
