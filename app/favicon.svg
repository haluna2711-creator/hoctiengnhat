<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6E2447"/>
      <stop offset="100%" stop-color="#3E1226"/>
    </linearGradient>
  </defs>

  <!-- squircle background -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="17" fill="url(#bg)"/>

  <!-- seal ring, referencing the site's role as a copyright/authentication registry -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#D9B168" stroke-width="1.4" opacity="0.75"/>

  <!-- brand initial: Đ, drawn in a literary serif -->
  <text x="32" y="32" text-anchor="middle" dominant-baseline="central"
        font-family="DejaVu Serif" font-weight="700" font-size="34"
        fill="#F3E6C8" letter-spacing="0">Đ</text>

  <!-- small ribbon / bookmark accent beneath the mark -->
  <path d="M 24 46.5 L 32 43 L 40 46.5 L 40 52 L 32 48.5 L 24 52 Z" fill="#D9B168"/>
</svg>
